<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e2e"/>
      <stop offset="0.55" stop-color="#0c1238"/>
      <stop offset="1" stop-color="#070b27"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#5b6cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.78" r="0.4">
      <stop offset="0" stop-color="#fcb53b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fcb53b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.78" cy="0.2" r="0.35">
      <stop offset="0" stop-color="#c5f036" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c5f036" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vfLg" x1="900" y1="200" x2="1100" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c5f036"/>
      <stop offset="1" stop-color="#fcb53b"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#c5f036"/>
      <stop offset="1" stop-color="#fcb53b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200"/>
    <path d="M240 0 V630 M480 0 V630 M720 0 V630 M960 0 V630"/>
  </g>

  <!-- Accent border -->
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="#c5f036" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Wordmark -->
  <text x="80" y="300"
        font-family="'Space Grotesk', system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="104" font-weight="700" letter-spacing="-2" fill="#ffffff">
    Vaporforge<tspan fill="#c5f036">.</tspan>EU
  </text>

  <!-- Tagline -->
  <text x="82" y="362"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="30" font-weight="400" fill="#cdd3ec" letter-spacing="0.5">
    European wholesale vape distributor
  </text>

  <!-- Sub-line / kicker -->
  <g transform="translate(82 410)">
    <rect width="14" height="14" rx="3" fill="#c5f036"/>
    <text x="26" y="12"
          font-family="system-ui, -apple-system, Segoe UI, sans-serif"
          font-size="20" font-weight="600" fill="#c5f036" letter-spacing="3">
      TPD · MHRA · EU-CEG · DDP 5-7 days
    </text>
  </g>

  <!-- LogoMark on right (large vapor-stream V) -->
  <g transform="translate(810 165) scale(8.3)">
    <rect width="36" height="36" rx="4" fill="#0a0e2e" stroke="#1c2350" stroke-width="0.4"/>
    <path d="M5.2 7.5 14.5 26a2 2 0 0 0 3.6 0l1.6-3.2-3.4-1.7L16 24 8.5 6Z" fill="url(#vfLg)"/>
    <path d="M19.4 21.1 26.2 7.5h3.3l-7.7 15.4Z" fill="url(#vfLg)" opacity="0.9"/>
    <circle cx="24.5" cy="14"  r="1.6" fill="#c5f036"/>
    <circle cx="27.8" cy="11.2" r="1.2" fill="#c5f036" opacity="0.75"/>
    <circle cx="30.4" cy="8.6"  r="0.9" fill="#c5f036" opacity="0.5"/>
    <circle cx="32.4" cy="6.4"  r="0.6" fill="#c5f036" opacity="0.3"/>
  </g>
</svg>
